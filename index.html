<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Live Cams</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 { 
            text-align: center; 
            margin-bottom: 40px;
            font-size: 2.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        /* Layout Grid: 1 column on mobile, 2 massive columns on large monitors */
        .cam-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
            max-width: 1700px;
            margin: 0 auto 60px auto;
        }
        @media (min-width: 1024px) {
            .cam-grid {
                grid-template-columns: repeat(2, 1fr); 
            }
        }
        
        /* Individual Camera Card Styling */
        .cam-card {
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #2d2d2d;
        }
        .cam-title {
            padding: 18px 20px;
            font-size: 1.3rem;
            font-weight: 600;
            background: #1a1a1a;
            border-bottom: 1px solid #2d2d2d;
        }
        
        /* Perfect widescreen aspect ratio layout viewport */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Ratio */
            height: 0;
            background: #252525;
        }
        .video-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <h1>Mountain Live Cams</h1>

    <div class="cam-grid">
        <!-- Card 1 -->
        <div class="cam-card">
            <div class="cam-title">June Patrol</div>
            <div class="video-container">
                <canvas class="placeholder-view"></canvas>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="cam-card">
            <div class="cam-title">Main Lodge Woolly Cam</div>
            <div class="video-container">
                <canvas class="placeholder-view"></canvas>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="cam-card">
            <div class="cam-title">Woolly's Adventure Summit</div>
            <div class="video-container">
                <canvas class="placeholder-view"></canvas>
            </div>
        </div>

        <!-- Card 4 -->
        <div class="cam-card">
            <div class="cam-title">McCoy Station</div>
            <div class="video-container">
                <canvas class="placeholder-view"></canvas>
            </div>
        </div>

        <!-- Card 5 -->
        <div class="cam-card">
            <div class="cam-title">Chair 14 Outpost</div>
            <div class="video-container">
                <canvas class="placeholder-view"></canvas>
            </div>
        </div>

        <!-- Card 6 -->
        <div class="cam-card">
            <div class="cam-title">Summit</div>
            <div class="video-container">
                <canvas class="placeholder-view"></canvas>
            </div>
        </div>

        <!-- Card 7 -->
        <div class="cam-card">
            <div class="cam-title">Eagle Lodge</div>
            <div class="video-container">
                <canvas class="placeholder-view"></canvas>
            </div>
        </div>

        <!-- Card 8 -->
        <div class="cam-card">
            <div class="cam-title">Tamarack</div>
            <div class="video-container">
                <canvas class="placeholder-view"></canvas>
            </div>
        </div>

        <!-- Card 9 -->
        <div class="cam-card">
            <div class="cam-title">The Village</div>
            <div class="video-container">
                <canvas class="placeholder-view"></canvas>
            </div>
        </div>

        <!-- Card 10 -->
        <div class="cam-card">
            <div class="cam-title">Canyon Lodge</div>
            <div class="video-container">
                <canvas class="placeholder-view"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Native rendering engine
        // Generates crisp geometric design grids directly inside the browser window
        document.querySelectorAll('.placeholder-view').forEach((canvas, index) => {
            canvas.width = 640;
            canvas.height = 360;
            const ctx = canvas.getContext('2d');
            
            // Draw clean background block
            ctx.fillStyle = '#1f2937';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Render design framework details
            ctx.strokeStyle = '#374151';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(canvas.width, canvas.height);
            ctx.moveTo(canvas.width, 0); ctx.lineTo(0, canvas.height);
            ctx.stroke();
            
            // Add view indicator text
            ctx.fillStyle = '#9ca3af';
            ctx.font = 'bold 24px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('CAM FEED VIEWPORT ' + (index + 1), canvas.width / 2, canvas.height / 2);
        });
    </script>

</body>
</html>
