<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Live Cams</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 { 
            text-align: center; 
            margin-bottom: 40px;
            font-size: 2.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        /* Layout Grid: 1 column on mobile, 2 massive rows on desktop screens */
        .cam-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
            max-width: 1700px; /* Gives the feeds maximum width across your monitor */
            margin: 0 auto 60px auto;
        }
        @media (min-width: 1024px) {
            .cam-grid {
                grid-template-columns: repeat(2, 1fr); 
            }
        }
        
        /* Individual Camera Card Styling */
        .cam-card {
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #2d2d2d;
        }
        .cam-title {
            padding: 18px 20px;
            font-size: 1.3rem;
            font-weight: 600;
            background: #1a1a1a;
            border-bottom: 1px solid #2d2d2d;
        }
        
        /* Perfect widescreen aspect ratio math */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Ratio */
            height: 0;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <h1>Mountain Live Cams</h1>

    <div class="cam-grid">
